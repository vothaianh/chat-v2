services:
  postgres:
    image: postgres:17-alpine
    container_name: chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatdb
    ports:
      - "5433:5432"
 
 
    volumes:
      - chat_pgdata:/var/lib/postgresql/data
      - ./backend/db/0001-init.sql:/docker-entrypoint-initdb.d/0001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chatdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared-network

  backend:
    image: truepilot2026/chat:latest
    build:
      context: ./backend
    container_name: chat-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: chat
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: chatdb
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      SOCKET_IO_PATH: /socket.io
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ap-southeast-1
      AWS_BUCKET: truepilot-chat
      # Optional Firebase service account JSON (base64). When empty, push service logs instead of sending.
      # Value is supplied via the git-ignored root .env file (see .env.example).
      FIREBASE_CREDENTIALS_BASE64: "${FIREBASE_CREDENTIALS_BASE64:-}"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:-chat-e4afe}"
      APNS_KEY_PATH: "${APNS_KEY_PATH:-/app/apns/AuthKey.p8}"
      APNS_KEY_ID: "${APNS_KEY_ID:-}"
      APNS_TEAM_ID: "${APNS_TEAM_ID:-}"
      APNS_BUNDLE_ID: "${APNS_BUNDLE_ID:-com.truepilot.chatv2}"
      TURN_URL: "${TURN_URL:-}"
      TURN_USERNAME: "${TURN_USERNAME:-}"
      TURN_CREDENTIAL: "${TURN_CREDENTIAL:-}"
    volumes:
      - ./apns/AuthKey.p8:/app/apns/AuthKey.p8:ro
    ports:
      - "3010:3010"
    networks:
      - shared-network

networks:
  shared-network:
    external: true

volumes:
  chat_pgdata: